name: CICD pipeline with Github Actions + ECR + ECS

on: 
  push:
    branches: [main]

permissions: 
  contents: read
  id-token: write
  packages: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push images
        uses: docker/build-push-action@v6
        with:
          content: .
          push : true
          tags: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:latest